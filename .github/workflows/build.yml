name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: codemail
          POSTGRES_PASSWORD: codemail
          POSTGRES_DB: codemail_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codemail" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Test with SQLite
        run: go test ./...
      - name: Test the API with PostgreSQL
        run: go test -count=1 ./internal/api/
        env:
          CODEMAIL_TEST_POSTGRES: postgres://codemail:codemail@localhost:5432/codemail_test?sslmode=disable

  # Drives the web app and the browser extension in a real Chromium.
  browser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the test browser
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Web app
        working-directory: e2e
        run: ./run.sh
      - name: Browser extension
        working-directory: e2e
        run: ./extension.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-screenshots
          path: e2e/shots

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
